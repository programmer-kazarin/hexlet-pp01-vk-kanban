databaseChangeLog:
  - changeSet:
      id: 001-create-users
      author: kanban
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: users
      changes:
        - createTable:
            tableName: users
            remarks: Пользователи системы
            columns:
              - column:
                  name: id
                  type: SERIAL
                  remarks: Идентификатор пользователя
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  remarks: Адрес почты для входа
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  remarks: Хеш пароля
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  remarks: Отображаемое имя
                  constraints:
                    nullable: false
